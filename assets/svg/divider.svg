<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 46" width="1200" height="46" role="img" aria-label="Animated cyan divider line">
  <defs>
    <linearGradient id="divRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0" />
      <stop offset="20%" stop-color="#2DD4BF" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#2DD4BF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="divPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0" />
      <stop offset="50%" stop-color="#5EEAD4" stop-opacity="1" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
  </defs>

  <rect x="0" y="22" width="1200" height="2" fill="url(#divRail)" />

  <rect x="-300" y="21.4" width="300" height="3.2" fill="url(#divPulse)" filter="url(#divGlow)">
    <animate attributeName="x" values="-300;1200" dur="5.2s" repeatCount="indefinite" />
  </rect>

  <g>
    <circle cx="0" cy="23" r="3.6" fill="#5EEAD4">
      <animate attributeName="cx" values="0;1200" dur="5.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="2.4;4.6;2.4" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="5.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <g fill="#818CF8">
    <circle cx="150" cy="23" r="1.6">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="430" cy="23" r="1.6">
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="2.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="760" cy="23" r="1.6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1040" cy="23" r="1.6">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
