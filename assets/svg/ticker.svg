<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 58" width="1200" height="58" role="img" aria-label="Scrolling ticker of focus areas">
  <defs>
    <linearGradient id="tickerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1220" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="tickerEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0" />
      <stop offset="25%" stop-color="#2DD4BF" stop-opacity="0.7" />
      <stop offset="75%" stop-color="#6366F1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1220" stop-opacity="1" />
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1220" stop-opacity="0" />
      <stop offset="100%" stop-color="#0B1220" stop-opacity="1" />
    </linearGradient>
    <clipPath id="trackClip">
      <rect x="128" y="6" width="1050" height="46" rx="6" />
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="56" rx="12" fill="url(#tickerBg)" stroke="url(#tickerEdge)" stroke-width="1.5" />

  <circle cx="30" cy="29" r="5" fill="#2DD4BF">
    <animate attributeName="r" values="3.6;6;3.6" dur="1.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <text x="46" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#5EEAD4">LIVE</text>
  <rect x="104" y="12" width="1.5" height="34" fill="#2DD4BF" opacity="0.35" />

  <g clip-path="url(#trackClip)">
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" letter-spacing="1.4">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-1200 0" dur="30s" repeatCount="indefinite" />
        <text x="140" y="35" fill="#E2E8F0">QUANT FINANCE</text>
        <text x="340" y="35" fill="#E2E8F0">EXPLAINABLE ML</text>
        <text x="540" y="35" fill="#E2E8F0">FINTECH INFRA</text>
        <text x="740" y="35" fill="#E2E8F0">GEOSPATIAL AI</text>
        <text x="940" y="35" fill="#E2E8F0">MARKET INTEL</text>
        <text x="1140" y="35" fill="#E2E8F0">RISK SYSTEMS</text>
        <g fill="#2DD4BF">
          <path d="M300 33 l5 5 l-5 5 l-5 -5 z" opacity="0.85" />
          <path d="M500 33 l5 5 l-5 5 l-5 -5 z" opacity="0.85" />
          <path d="M700 33 l5 5 l-5 5 l-5 -5 z" opacity="0.85" />
          <path d="M900 33 l5 5 l-5 5 l-5 -5 z" opacity="0.85" />
          <path d="M1100 33 l5 5 l-5 5 l-5 -5 z" opacity="0.85" />
        </g>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-1200 0" dur="30s" repeatCount="indefinite" />
        <text x="1340" y="35" fill="#E2E8F0">QUANT FINANCE</text>
        <text x="1540" y="35" fill="#E2E8F0">EXPLAINABLE ML</text>
        <text x="1740" y="35" fill="#E2E8F0">FINTECH INFRA</text>
        <text x="1940" y="35" fill="#E2E8F0">GEOSPATIAL AI</text>
        <text x="2140" y="35" fill="#E2E8F0">MARKET INTEL</text>
        <text x="2340" y="35" fill="#E2E8F0">RISK SYSTEMS</text>
        <g fill="#818CF8">
          <path d="M1500 33 l5 5 l-5 5 l-5 -5 z" opacity="0.85" />
          <path d="M1700 33 l5 5 l-5 5 l-5 -5 z" opacity="0.85" />
          <path d="M1900 33 l5 5 l-5 5 l-5 -5 z" opacity="0.85" />
          <path d="M2100 33 l5 5 l-5 5 l-5 -5 z" opacity="0.85" />
          <path d="M2300 33 l5 5 l-5 5 l-5 -5 z" opacity="0.85" />
        </g>
      </g>
    </g>
    <rect x="128" y="6" width="70" height="46" fill="url(#fadeLeft)" />
    <rect x="1108" y="6" width="70" height="46" fill="url(#fadeRight)" />
  </g>

  <rect x="128" y="54" width="1050" height="1.5" fill="url(#tickerEdge)" opacity="0.5" />
</svg>
