<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Animated circuit grid">
  <defs>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.1" fill="#2DD4BF" opacity="0.18" />
    </pattern>
    <linearGradient id="traceA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0" />
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="traceB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>
    <filter id="traceGlow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="2.6" />
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="120" fill="url(#dots)" />

  <path d="M0 30 H300 l20 20 H620 l20 -20 H1200" fill="none" stroke="#1E3A5F" stroke-width="1" opacity="0.55" />
  <path d="M0 90 H260 l24 -24 H760 l24 24 H1200" fill="none" stroke="#1E3A5F" stroke-width="1" opacity="0.55" />
  <path d="M0 60 H180 l16 16 H900 l16 -16 H1200" fill="none" stroke="#1E3A5F" stroke-width="1" opacity="0.35" />

  <g filter="url(#traceGlow)">
    <rect x="-200" y="29.2" width="200" height="2" fill="url(#traceA)">
      <animate attributeName="x" values="-200;1200" dur="7s" repeatCount="indefinite" />
    </rect>
    <rect x="1200" y="89.2" width="200" height="2" fill="url(#traceB)">
      <animate attributeName="x" values="1200;-200" dur="9s" repeatCount="indefinite" />
    </rect>
  </g>

  <g>
    <circle cx="0" cy="30" r="2.8" fill="#5EEAD4">
      <animate attributeName="cx" values="0;1200" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="1200" cy="90" r="2.8" fill="#818CF8">
      <animate attributeName="cx" values="1200;0" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="9s" repeatCount="indefinite" />
    </circle>
  </g>

  <g fill="#2DD4BF">
    <circle cx="320" cy="50" r="2.2">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="640" cy="30" r="2.2">
      <animate attributeName="opacity" values="1;0.15;1" dur="3.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="884" cy="76" r="2.2">
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1060" cy="51" r="2.2">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.9s" repeatCount="indefinite" />
    </circle>
  </g>
  <g fill="#A78BFA">
    <circle cx="180" cy="76" r="2">
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="460" cy="51" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="760" cy="90" r="2">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="4.2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
