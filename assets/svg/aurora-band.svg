<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Animated aurora glow band">
  <defs>
    <radialGradient id="auroraTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#2DD4BF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auroraIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auroraViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sweepLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0" />
      <stop offset="45%" stop-color="#2DD4BF" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="railGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.1" />
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <ellipse cx="200" cy="86" rx="210" ry="92" fill="url(#auroraTeal)">
      <animate attributeName="cx" values="200;420;200" dur="17s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1" />
      <animate attributeName="cy" values="86;58;86" dur="11s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.55;0.9" dur="9s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="600" cy="96" rx="240" ry="100" fill="url(#auroraIndigo)">
      <animate attributeName="cx" values="600;380;760;600" dur="23s" repeatCount="indefinite" />
      <animate attributeName="cy" values="96;72;110;96" dur="15s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.55;0.95;0.55" dur="13s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="980" cy="80" rx="205" ry="88" fill="url(#auroraViolet)">
      <animate attributeName="cx" values="980;820;980" dur="19s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1" />
      <animate attributeName="cy" values="80;108;80" dur="12s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="10s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <rect x="0" y="84" width="1200" height="2" fill="url(#railGrad)" />
  <g>
    <rect x="-260" y="84" width="260" height="2" fill="url(#sweepLine)">
      <animate attributeName="x" values="-260;1200" dur="6.5s" repeatCount="indefinite" />
    </rect>
    <circle cx="-120" cy="85" r="3.5" fill="#5EEAD4">
      <animate attributeName="cx" values="-120;1240" dur="6.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="6.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
